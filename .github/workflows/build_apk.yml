name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Project Source
        working-directory: mobile_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Tests
        working-directory: mobile_app
        run: flutter test --no-pub || true

      - name: Build Universal Release APK
        working-directory: mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Split-per-ABI Release APKs
        working-directory: mobile_app
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DFM-Korba-Universal-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Split-ABI APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DFM-Korba-Split-APKs
          path: mobile_app/build/app/outputs/flutter-apk/app-*.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: DFM Korba Official App v1.0.0 (Build ${{ github.run_number }})
          draft: false
          prerelease: false
          files: |
            mobile_app/build/app/outputs/flutter-apk/app-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          body: |
            ## DFM Korba Official Mobile Application Release
            **Skill Development Learning & Competition Management Platform**
            
            ### Included Builds:
            - **Universal APK**: `app-release.apk` (Supports all Android devices)
            - **ARM64-v8a APK**: Optimized for modern 64-bit devices
            - **ARMeabi-v7a APK**: Optimized for legacy 32-bit devices
            
            ### Changelog:
            - Full Flutter 3.x cross-platform mobile architecture.
            - Modern Neumorphic aviation dark mode with 10 micro-interactions.
            - Role-based modules: Student, Teacher, Team Portal, and Admin.
            - Google Apps Script + Google Sheets (32 normalized tables) + Google Drive backend.
            - Gemini AI Quiz engine, dual marks recording, and student work gallery.
            - 1-Click WhatsApp student invitation workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

